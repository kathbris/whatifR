<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What Happens If? Circuit Trainer</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f9;--card:#fff;--tx:#18202b;--mut:#5a6676;--bd:#d3d9e1;--ac:#1d5fc4;--acb:#e6effc;--ok:#17743a;--okb:#e2f4e8;--bad:#b3261e;--badb:#fbe8e6;--hl:#d4690a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12171e;--card:#1b222c;--tx:#e8edf3;--mut:#9aa7b8;--bd:#34404f;--ac:#6aa6ff;--acb:#1c2b45;--ok:#5ed48b;--okb:#17301f;--bad:#ff8a80;--badb:#3a1c1a;--hl:#ffa04d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12171e;--card:#1b222c;--tx:#e8edf3;--mut:#9aa7b8;--bd:#34404f;--ac:#6aa6ff;--acb:#1c2b45;--ok:#5ed48b;--okb:#17301f;--bad:#ff8a80;--badb:#3a1c1a;--hl:#ffa04d}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:780px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2rem 0}.sub{color:var(--mut);margin:0 0 14px;font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px}
button:hover:not(:disabled){border-color:var(--ac)}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.stats{margin-left:auto;color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-top:14px}
#q{font-size:1.15rem;line-height:1.45;margin:0 0 10px}#q .c{color:var(--hl)}
#fig{overflow-x:auto;text-align:center}
svg{color:var(--tx);height:auto}svg .hl{color:var(--hl)}
svg text{fill:currentColor;stroke:none;font:600 12px system-ui,sans-serif;text-anchor:middle}
.cap{color:var(--mut);font-size:.82rem;margin:4px 0 0}
.ans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.ans button{font-weight:600;padding:14px 8px}
.ans .right{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.ans .wrong{background:var(--badb);border-color:var(--bad);color:var(--bad)}
#fb{margin-top:14px;padding:12px 14px;border-radius:10px;line-height:1.5;font-size:.95rem}
#fb.ok{background:var(--okb)}#fb.no{background:var(--badb)}#fb p{margin:.4rem 0 0}
#next{margin-top:12px;background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
[hidden]{display:none!important}
@media(max-width:480px){.ans{grid-template-columns:1fr}}
</style></head>
<body><main>
<h1>⚡ What Happens If…?</h1>
<p class="sub">Predict how a resistive circuit responds to a change. Choose Increase, Decrease or Stay the same.</p>
<div class="row" id="tabs"></div>
<div class="row" style="margin-top:10px"><span class="stats" id="stats" style="margin-left:0"></span></div>
<div class="card">
<p id="q"></p>
<div id="fig"></div>
<p class="cap">Diagram shows the circuit before the change. The part that changes is highlighted in orange.</p>
<div class="ans" id="ans"></div>
<div id="fb" hidden></div>
<button id="next" hidden>Next question →</button>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const VALS=[10,15,22,33,47,68,100,150,220,330],SRC=[12,24,48,120];
let rc=0,sel='series',st={ok:0,n:0,streak:0},Q=null;
const R=()=>({t:'r',id:'R'+(++rc),r:pick(VALS)});
const S=(...c)=>({t:'s',c}),P=(...c)=>({t:'p',c});
const cnt=()=>2+Math.floor(Math.random()*3);
function build(tp){rc=0;
 if(tp==='series')return S(...Array.from({length:cnt()},()=>R()));
 if(tp==='parallel')return P(...Array.from({length:cnt()},()=>R()));
 return pick([()=>S(R(),P(R(),R())),()=>S(P(R(),R()),R()),()=>S(R(),P(R(),R()),R()),()=>S(R(),P(R(),S(R(),R()))),()=>S(P(S(R(),R()),R()),R())])();
}
const leaves=n=>n.t==='r'?[n]:n.c.flatMap(leaves);
function req(n,o){
 if(n.t==='r')return n.q=o[n.id]!==undefined?o[n.id]:n.r;
 const q=n.c.map(c=>req(c,o));
 return n.q=n.t==='s'?q.reduce((a,b)=>a+b,0):1/q.reduce((a,b)=>a+1/b,0);
}
function dist(n,V,out){
 if(n.t==='r'){out[n.id]={V,I:V/n.q,P:V*V/n.q,R:n.q};return}
 if(n.t==='s'){const I=V/n.q;n.c.forEach(c=>dist(c,I*c.q,out))}else n.c.forEach(c=>dist(c,V,out));
}
function solve(t,V,o){const Rt=req(t,o),out={};dist(t,V,out);out.SRC={V,I:V/Rt,P:V*V/Rt,R:Rt};return out}
function f(v,u){
 const a=Math.abs(v);
 if(u==='Ω'&&a>=1e8)return'∞ Ω (open)';
 if(a<1e-5)return'0 '+u;
 const n=x=>String(Number(x.toPrecision(3)));
 if(a>=1000)return n(v/1000)+' k'+u;
 if(a>=1)return n(v)+' '+u;
 return n(v*1000)+' m'+u;
}
const UN={I:'A',V:'V',P:'W',R:'Ω'};
function tgtText(id,q){
 if(id==='SRC')return{I:'the total current supplied by the source',P:'the total power supplied by the source',R:'the total resistance of the circuit',V:'the source voltage'}[q];
 return{I:'the current through ',V:'the voltage across ',P:'the power dissipated by ',R:'the resistance of '}[q]+id;
}
function chgText(k,id){return{vUp:'the source voltage increases',vDown:'the source voltage decreases',rUp:'the resistance of '+id+' increases',rDown:'the resistance of '+id+' decreases',open:id+' is removed from the circuit (open circuit)',short:id+' is shorted out (bypassed by a wire)'}[k]}
function newQ(){
 for(;;){
  const tp=sel==='mixed'?pick(['series','parallel','spc']):sel,tree=build(tp),L=leaves(tree),V=pick(SRC),k=pick(['vUp','vDown','rUp','rDown','open','short']);
  const ch=k[0]==='v'?null:pick(L);let V2=V;const o={};
  if(k==='vUp')V2=V*1.5;if(k==='vDown')V2=V*.5;
  if(k==='rUp')o[ch.id]=ch.r*2;if(k==='rDown')o[ch.id]=ch.r/2;if(k==='open')o[ch.id]=1e9;if(k==='short')o[ch.id]=1e-6;
  const b=solve(tree,V,{}),a=solve(tree,V2,o);
  if(a.SRC.R<1)continue;
  const c=[];
  L.forEach(l=>(ch&&l===ch?['I','V','P']:['I','V','P','R']).forEach(q=>c.push([l.id,q])));
  ['I','P','R','V'].forEach(q=>{if(!(q==='V'&&!ch))c.push(['SRC',q])});
  const[id,q]=pick(c),bv=b[id][q],av=a[id][q],d=Math.abs(av-bv);
  const ans=d<=1e-6*Math.max(Math.abs(av),Math.abs(bv))+1e-9?'same':av>bv?'inc':'dec';
  return{tp,tree,V,V2,k,ch,id,q,bv,av,ans};
 }
}
function meas(n){
 if(n.t==='r')return n.m={w:80,u:28,d:10};
 const m=n.c.map(meas);
 if(n.t==='s')return n.m={w:m.reduce((s,x)=>s+x.w,0),u:Math.max(...m.map(x=>x.u)),d:Math.max(...m.map(x=>x.d))};
 let h=0;const ys=m.map(x=>{h+=x.u;const y=h;h+=x.d+10;return y});
 const e=(ys[0]+ys[ys.length-1])/2;
 return n.m={w:Math.max(...m.map(x=>x.w))+40,u:e,d:h-10-e,ys,e};
}
function dr(n,x,y,ch){
 if(n.t==='r'){
  let p=`M${x} ${y}H${x+15}`;
  for(let i=0;i<6;i++)p+=`L${x+15+(i+.5)*50/6} ${y+(i%2?8:-8)}`;
  p+=`L${x+65} ${y}H${x+80}`;
  return `<g class="${n===ch?'hl':''}"><path d="${p}"/><text x="${x+40}" y="${y-16}">${n.id} = ${f(n.r,'Ω')}</text></g>`;
 }
 if(n.t==='s'){let s='',cx=x;n.c.forEach(c=>{s+=dr(c,cx,y,ch);cx+=c.m.w});return s}
 const m=n.m,W=m.w,top=y-m.e,y0=top+m.ys[0],y1=top+m.ys[m.ys.length-1];
 let s=`M${x} ${y}H${x+20}M${x+W-20} ${y}H${x+W}M${x+20} ${y0}V${y1}M${x+W-20} ${y0}V${y1}`,g='';
 n.c.forEach((c,i)=>{
  const by=top+m.ys[i],pad=(W-40-c.m.w)/2;
  s+=`M${x+20} ${by}H${x+20+pad}M${x+20+pad+c.m.w} ${by}H${x+W-20}`;
  g+=dr(c,x+20+pad,by,ch);
 });
 return `<path d="${s}"/>`+g;
}
function draw(Q){
 const t=Q.tree,m=meas(t),x0=95,top=14+m.u,bot=top+Math.max(m.d+36,80),W=x0+m.w+55,H=bot+14,mid=(top+bot)/2,rx=x0+m.w+30,hv=Q.k[0]==='v';
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${Math.max(W*1.3,360)}px" role="img" aria-label="Circuit diagram"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M45 ${top}V${mid-8}M45 ${mid+8}V${bot}H${rx}V${top}H${x0+m.w}M45 ${top}H${x0}"/>${dr(t,x0,top,Q.ch)}<g class="${hv?'hl':''}"><path d="M28 ${mid-8}H62"/><path d="M37 ${mid+8}H53" stroke-width="5"/><text x="70" y="${mid+4}" style="text-anchor:start">${Q.V} V</text><text x="32" y="${mid-14}" style="font-size:14px">+</text></g></g></svg>`;
}
const HT={series:"In a series circuit the same current flows through every component, the source voltage divides across the resistors in proportion to their resistance, and total resistance is the sum of the parts.",parallel:"In a parallel circuit every branch has the full source voltage, each branch current is set by its own resistance (I = V/R), the branch currents add to give total current, and adding branches lowers total resistance.",spc:"For series-parallel circuits, reduce each parallel group to one equivalent resistance, solve the resulting series circuit, then work back into the branches using the voltage across each group."};
const CT={vUp:"Raising the source voltage raises every voltage and current by the same proportion (Ohm’s law), and power rises with the square of the voltage.",vDown:"Lowering the source voltage lowers every voltage and current by the same proportion (Ohm’s law), and power falls with the square of the voltage.",rUp:"More resistance in a path means less current in that path (I = V/R), and the total resistance of the circuit goes up.",rDown:"Less resistance in a path means more current in that path (I = V/R), and the total resistance of the circuit goes down.",open:"An open circuit has effectively infinite resistance, so no current can flow through that path. Its terminals will see the full voltage that was across the path.",short:"A short is a zero-resistance path. Current takes it and bypasses anything it is directly in parallel with, and the shorted part drops no voltage."};
function show(){
 Q=newQ();
 $('q').innerHTML=`What happens to <b>${tgtText(Q.id,Q.q)}</b> if <b class="c">${chgText(Q.k,Q.ch?Q.ch.id:'')}</b>?`;
 $('fig').innerHTML=draw(Q);
 $('ans').innerHTML='';
 [['inc','Increase'],['same','Stay the same'],['dec','Decrease']].forEach(([v,l])=>{
  const b=document.createElement('button');b.textContent=l;b.dataset.v=v;b.onclick=()=>answer(v);$('ans').appendChild(b);
 });
 $('fb').hidden=true;$('next').hidden=true;
}
function answer(a){
 if(Q.done)return;Q.done=1;st.n++;
 const ok=a===Q.ans;if(ok){st.ok++;st.streak++}else st.streak=0;
 document.querySelectorAll('#ans button').forEach(b=>{b.disabled=true;if(b.dataset.v===Q.ans)b.classList.add('right');else if(b.dataset.v===a)b.classList.add('wrong')});
 const name={inc:'Increase',dec:'Decrease',same:'Stay the same'}[Q.ans],u=UN[Q.q];
 const sv=Q.k[0]==='v'?` (source: ${Q.V} V → ${f(Q.V2,'V')})`:'';
 const fb=$('fb');fb.className=ok?'ok':'no';
 fb.innerHTML=`<b>${ok?'Correct!':'Not quite.'}</b> The answer is <b>${name}</b>.<p>Before: <b>${f(Q.bv,u)}</b> → After: <b>${f(Q.av,u)}</b>${sv}</p><p>${CT[Q.k]}</p><p>${HT[Q.tp]}</p>`;
 fb.hidden=false;$('next').hidden=false;stats();
}
function stats(){$('stats').textContent=`Score: ${st.ok} / ${st.n} · Streak: ${st.streak}`}
const TABS=[['series','Series'],['parallel','Parallel'],['spc','Series-parallel'],['mixed','Mixed']];
function tabs(){
 $('tabs').innerHTML='';
 TABS.forEach(([v,l])=>{
  const b=document.createElement('button');b.className='tab'+(v===sel?' on':'');b.textContent=l;
  b.onclick=()=>{sel=v;tabs();show()};$('tabs').appendChild(b);
 });
}
$('next').onclick=show;
tabs();stats();show();
</script>
</body></html>
